[project]
name = "papermatch-api"
version = "0.1.0"
description = "PaperMatch API — feed, translation, saved library and provenance-tracked paper metadata."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.0",
    "pyjwt>=2.9.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.2",
    "ruff>=0.7.3",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["papermatch_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: requires a live PostgreSQL database",
    "e2e: end-to-end flow across the HTTP API and the database",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    # FastAPI's Depends()/Query() defaults are the framework's intended style.
    "B008",
    # The spec is Japanese and the placeholder tokens are deliberately non-ASCII
    # (⟦MATH_n⟧); flagging them as "ambiguous unicode" is noise here.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Alembic writes these; reformatting them would obscure the diff against autogenerate.
"alembic/versions/*.py" = ["E501"]

[tool.ruff.lint.isort]
# `alembic` is the installed package, not the local migrations directory of the same name.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = []
warn_return_any = true
disallow_untyped_defs = true
exclude = "alembic/versions"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
